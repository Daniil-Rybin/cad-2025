<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - Курьерская служба</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/css/login.css}"/>
</head>
<body class="login-page">

<div class="login-wrapper">
    <div class="login-card">
        <h1 class="login-title">Курьерская служба</h1>
        <p class="login-subtitle">Регистрация нового пользователя</p>

        <div th:if="${error}" class="login-alert login-alert-error" th:text="${error}"></div>

        <form th:action="@{/register}" method="post" class="login-form">
            <label for="username">Логин</label>
            <input type="text" id="username" name="username"
                   placeholder="Придумайте логин" required/>

            <label for="fullName">ФИО</label>
            <input type="text" id="fullName" name="fullName"
                   placeholder="Иванов Иван Иванович" required/>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="example@mail.ru"/>

            <label for="password">Пароль</label>
            <input type="password" id="password" name="password"
                   placeholder="Не менее 6 символов" required minlength="6"/>

            <label for="confirmPassword">Повторите пароль</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   placeholder="Повторите пароль" required/>

            <button type="submit" class="btn login-btn">Зарегистрироваться</button>
        </form>

        <p style="margin-top: 20px; text-align: center; font-size: 14px;">
            Уже есть аккаунт?
            <a th:href="@{/login}" style="color: #2c3e50; font-weight: bold;">Войти</a>
        </p>
    </div>
</div>

</body>
</html>
